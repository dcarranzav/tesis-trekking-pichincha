name: Pruebas (suite completa)
on:
  push:
    branches: [ci-prueba-74584a6]
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias del proyecto (equivalen a environment.yml)
        run: |
          python -m pip install --upgrade pip
          pip install pytest "streamlit>=1.66" "requests<3" numpy pandas geopandas shapely rasterio pyproj pyogrio gpxpy scikit-learn scipy matplotlib seaborn networkx folium pillow openpyxl nbformat ipykernel
          pip list | grep -i -E "streamlit|gpxpy|geopandas|shapely|pyproj|rasterio|scikit|pandas|numpy|nbformat|pytest"
      - name: Suite completa
        run: |
          mkdir -p _tmp
          python -m pytest tests -v -rsfE --no-header -p no:cacheprovider 2>&1 | tee resultado.txt
          echo "---- RESUMEN ----"
          tail -3 resultado.txt
      - name: Descargas con atribución
        run: python -m pytest tests/test_descargas_atribucion.py tests/test_aviso_puede_variar.py tests/test_app_streamlit_real.py -v -rs --no-header -p no:cacheprovider
